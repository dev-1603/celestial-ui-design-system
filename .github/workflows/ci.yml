name: CI

on:
  push:
    branches: ['develop', 'master', 'release/**']
  pull_request:
    branches: ['develop', 'master', 'release/**']

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build package-validate tooling
        run: pnpm --filter @celestial-ui/package-validate build

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Changeset Validation
        run: pnpm changeset status

      - name: Validate packages and documentation
        run: node tooling/package-validate/dist/cli.js

      - name: Consumer tests (pnpm)
        run: pnpm consumer:test

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.1.20'

      - name: Consumer tests (Bun)
        run: pnpm consumer:test:bun

      - name: Upload validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-report
          path: reports/
